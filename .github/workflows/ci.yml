name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml pytest
      - run: bash scripts/selftest.sh
      - run: python -m pytest -q tests
